[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "surface-features"
version = "0.1.0"
description = "Do cheap surface features separate hostile Spanish comments from ordinary ones?"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Luis Manuel Barrios Núñez" }]
dependencies = []

[project.optional-dependencies]
# The core measurement code is standard library only. spaCy is needed to parse
# a real corpus and scikit-learn to run the classifier floor; neither is needed
# to run the test suite or the offline example.
nlp = ["spacy>=3.7", "scikit-learn>=1.3"]
dev = ["pytest>=8"]

[project.scripts]
surface-features = "surface_features.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 90
target-version = "py310"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, UP pyupgrade,
# B bugbear, SIM simplification, C4 comprehensions, RUF ruff-specific.
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Long, descriptive test names are the point.
"tests/*" = ["E501"]

[tool.ruff.format]
docstring-code-format = true
